<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- ENCABEZADO -->
    <h3 class="mb-5">
        Tienda Interactiva de
        <small class="text-body-secondary">almuerzos</small>
      </h3>

      <!-- SELECTOR -->
       <form action="" class="mb-5">
            <div class="form-floating">
                <select class="form-select" id="floatingSelect" aria-label="Floating label select example" style="width: 15rem;" >
                    <option selected>Elige tu comida</option>
                    <option value="1">Arroz paisa</option>
                    <option value="2">Arroz chino</option>
                    <option value="3">Almuerzo ejecutivo</option>
                </select>
            <label for="floatingSelect">Selecciona el campo</label>
            </div>
            <input class="btn btn-primary mt-1" type="submit" value="Añadir al carrito">
    </form>

      <!-- TARJETAS -->
      <div class="container text-center">
  <div class="row">
    <div class="col align-self-start">
        <div class="card card1" style="width: 15rem;">
            <img src="./almuerzo.jpg" class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-title">Almuerzo ejecutivo</h5>
              
              
            </div>
          </div>
    </div>
    <div class="col align-self-center">
        <div class="card card2" style="width: 15rem;">
            <img src="./chino.jpg" class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-title">Arroz chino</h5>
              
              
            </div>
          </div>
    </div>
    <div class="col align-self-end">
        <div class="card card3" style="width: 15rem;">
            <img src="./paisa.jpg" class="card-img-top" alt="...">
            <div class="card-body">
              <h5 class="card-title">Arroz paisa</h5>
              
              
            </div>
          </div>
    </div>
  </div>
</div>

</body>
</html>
